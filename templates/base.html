<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Resume Parser{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f7fa; }
        .navbar-brand { font-weight: 600; }
        .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .skill-badge { margin: 2px; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'dashboard' %}">📄 Resume Parser</a>
        {% if user.is_authenticated %}
        <div class="d-flex">
            <a href="{% url 'upload_resume' %}" class="btn btn-outline-light btn-sm me-2">Upload Resume</a>
            <span class="navbar-text text-light me-3">Hi, {{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-outline-light">Logout</button>
            </form>
        </div>
        {% endif %}
    </div>
</nav>
<div class="container">
    {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
