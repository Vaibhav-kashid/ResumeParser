{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<div class="card p-4">
  <h3>Edit Candidate Profile</h3>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" class="form-control" name="name" value="{{ candidate.name }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" name="email" value="{{ candidate.email }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Phone</label>
      <input type="text" class="form-control" name="phone" value="{{ candidate.phone }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Address</label>
      <input type="text" class="form-control" name="address" value="{{ candidate.address }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Summary</label>
      <textarea class="form-control" name="summary" rows="3">{{ candidate.summary }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'candidate_profile' candidate.pk %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
