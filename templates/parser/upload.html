{% extends "base.html" %}
{% block title %}Upload Resume{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h3 class="mb-3">Upload Resume</h3>
      <p class="text-muted">Supported formats: PDF, DOCX (max {{ MAX_RESUME_UPLOAD_SIZE_MB|default:5 }} MB)</p>
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">Upload & Parse</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
